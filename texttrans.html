<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" sizes="32x32" href="/web/images/favicon.png"><title>Multi-Language Text Translator Pro</title><script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script><script src="https://cdn.jsdelivr.net/gh/evidenceprime/html-docx-js@master/dist/html-docx.js"></script><style> :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f1f5f9; --accent: #3b82f6; --success: #42A785; --danger: #ef4444; } body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; } .app { display: flex; height: 100vh; padding: 15px; gap: 15px; box-sizing: border-box; } .pane { flex: 1 1 50%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; position: relative; min-width: 0; } .header { padding: 10px 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; } .title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; } .lang-select { background: #334155; color: white; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; } .lang-select:hover { border-color: var(--accent); } /* Word файлын агуулга харагдах талбар */ .content-area { flex: 1; padding: 20px; border: none; outline: none; background: transparent; color: #cbd5e1 !important; font-size: 14px; line-height: 1.6; overflow-y: auto; box-sizing: border-box; } .content-area p { margin: 0 0 10px 0; color: #cbd5e1 !important; } .btn { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; text-decoration: none; text-align: center; } .btn-clear { background: #334155; color: white; } .btn-clear:hover { background: var(--danger); } .btn-copy { background: var(--accent); color: white; } /* Файл сонгох ухаалаг товчлуур */ .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; } .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; } .btn-upload { background: var(--accent); color: white; display: inline-block; } .translate-btn { position: absolute; bottom: 25px; right: 25px; padding: 12px 24px; background: var(--success); color: white; border: none; border-radius: 50px; font-weight: 500; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.3); z-index: 100; display: flex; align-items: center; gap: 8px; } .translate-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.8; } #progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--success); width: 0%; transition: width 0.3s; } .content-area:empty::before { content: attr(placeholder); color: #64748b; font-size: 14px; cursor: text; } /* хэлний код олж харах линк https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes */ </style></head><body><div class="app"><div class="pane"><div class="header"><span class="title" id="file-status">Source</span><div style="display: flex; gap: 10px; align-items: center;"><div class="file-input-wrapper"><button class="btn btn-upload">Choose .docx File</button><input type="file" id="wordFile" accept=".docx" onchange="handleFileLoad(this)"></div><label style="font-size: 11px; color: #94a3b8;">TARGET LANGUAGE:</label><select id="targetLang" class="lang-select"><option value="en">English</option><option value="fr">French</option><option value="de">German</option><option value="es">Spanish</option><option value="pt">Portuguese</option><option value="it">Italian</option><option value="uk">Ukrainian</option><option value="he">Hebrew</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="mn">Mongolian</option><option value="ru">Russian</option></select><button class="btn btn-clear" onclick="clearFields()">Clear</button></div></div><div id="in" class="content-area" contenteditable="true" spellcheck="false" placeholder="Эх текстээ (Дурын хэлээр) энэ талбарт оруулах, хуулж тавих (CTRL+V), эсвэл шууд бичих..."></div><button class="translate-btn" id="btn" onclick="startTranslation()"><span id="btn-txt">TRANSLATE NOW</span></button></div><div class="pane"><div id="progress"></div><div class="header"><span class="title">Translated Result</span><button class="btn btn-copy" id="download-btn" onclick="downloadWordResult()" disabled style="background: #475569; cursor: not-allowed;">Download .docx</button></div><div id="out" class="content-area" spellcheck="false" placeholder="Орчуулгын үр дүн энэ талбарт гарна..."></div></div></div><script src="https://the2m16.github.io/tools/js/textorchuulahengine.js"></script></body></html>
