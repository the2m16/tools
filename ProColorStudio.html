<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the2m16 - Color Studio Pro</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/web/images/favicon.png">
    <style>
        :root {
            --bg-main: #0b0e14;
            --sidebar-bg: #1e2633;
            --card-bg: #252f3f;
            --border: #323d4d;
            --accent: #5e5ce6;
            --text-label: #8e96a3;
            --text-value: #ffffff;
            --input-bg: #161b22;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-value);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 11px;
        }

        .sidebar {
            width: 440px;
            background: rgba(30, 41, 59, 0.9);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .brand {
            font-weight: 800;
            font-size: 14px;
            color: var(--text-value);
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        .brand span { color: var(--accent); }

        .group-title {
            color: var(--text-label);
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
        }

        .group-title::before {
            content: '+';
            margin-right: 8px;
            color: var(--accent);
        }

        .control-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 5px;
            border: 1px solid var(--border);
        }

        #mainPicker {
            width: 100%;
            height: 160px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        #hexDisplay {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-value);
            padding: 10px;
            text-align: center;
            font-size: 30px;
            border-radius: 4px;
            outline: none;
            margin-top: 15px;
        }

        .contrast-badge {
            margin-top: 10px;
            padding: 46px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 300;
        }

        .workspace {
        	width: auto;
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section-header {
            font-size: 15px;
            color: var(--text-label);
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .color-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .color-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .swatch {
            height: 190px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .swatch-info {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
        }

        /* Мэдэгдэл (Toast) стиль */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .btn-format {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-label);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 16px;
            font-weight: 300;
        }
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        button { 
            margin-top: 15px;
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border); 
            color: white;
            padding: 10px 5px; 
            border-radius: 8px; 
            font-size: 0.65rem; 
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        
        a:link, a:visited { color: white; padding: 2px 5px; text-align: center; text-decoration: none; display: inline-block; }
        a:hover, a:active { color: #6366f1; }
        
        
    </style>
</head>
<body>

<div class="toast" id="copyToast">COPIED TO CLIPBOARD</div>

<aside class="sidebar">
    <h1 style="font-size: 1.4rem; margin-bottom: 25px; font-weight: 900;">Color Studio <span style="color: #6366f1;">Pro</span></h1>
    
    <div class="group-title">Master Color</div>
    <div class="control-panel">
        <input type="color" id="mainPicker" value="#5e5ce6">
        <input type="text" id="hexDisplay" value="#5E5CE6" maxlength="7">
    </div>

    <div class="group-title">Contrast Analysis</div>
    <div id="contrastCard" class="contrast-badge">
        <span>WCAG 2.1</span>
        <span id="contrastRatio">PASS</span>
    </div>

    <div class="group-title">Export</div>
    <button class="btn-format">JSON EXPORT</button>
        <div class="btn-group">
                <button><a href="https://the2m16.github.io/web/0ProFormatStudio.html">PRO FORMAT STUDIO</a></button>
                <button><a href="https://the2m16.github.io/web/0ProColorStudio.html">PRO COLOR STUDIO</a></button>
                <button><a href="https://the2m16.github.io/web/0ProTypeScale.html">PRO TYPE SCALE</a></button>
                <button><a href="https://the2m16.github.io/web/0ProWordToHTML.html">PRO HTML STUDIO</a></button>
        </div>
</aside>

<main class="workspace" id="workspace">
    <div class="section-header">01 / TRIADIC HARMONY</div>
    <div class="palette-grid" id="triadic"></div>

    <div class="section-header">02 / TETRADIC HARMONY</div>
    <div class="palette-grid" id="tetradic"></div>

    <div class="section-header">03 / TINTS & SHADES</div>
    <div class="palette-grid" id="shades"></div>
</main>

<script>
    const picker = document.getElementById('mainPicker');
    const hexInput = document.getElementById('hexDisplay');
    const toast = document.getElementById('copyToast');

    picker.addEventListener('input', (e) => {
        const color = e.target.value.toUpperCase();
        hexInput.value = color;
        updateAll(color);
    });

    hexInput.addEventListener('input', (e) => {
        let color = e.target.value;
        if(!color.startsWith('#')) color = '#' + color;
        if(/^#[0-9A-F]{6}$/i.test(color)) {
            picker.value = color;
            updateAll(color);
        }
    });

    function updateAll(hex) {
        const hsl = hexToHSL(hex);
        generateTriadic(hsl);
        generateTetradic(hsl);
        generateShades(hex);
        checkContrast(hex);
    }

    function hexToHSL(hex) {
        let r = parseInt(hex.substring(1,3), 16) / 255;
        let g = parseInt(hex.substring(3,5), 16) / 255;
        let b = parseInt(hex.substring(5,7), 16) / 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max == min) h = s = 0;
        else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }

    function hslToHex(h, s, l) {
        l /= 100;
        const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    function generateTriadic(hsl) {
        const container = document.getElementById('triadic');
        container.innerHTML = '';
        [0, 120, 240].forEach(angle => createNode(hslToHex((hsl.h + angle) % 360, hsl.s, hsl.l), container));
    }

    function generateTetradic(hsl) {
        const container = document.getElementById('tetradic');
        container.innerHTML = '';
        [0, 90, 180, 270].forEach(angle => createNode(hslToHex((hsl.h + angle) % 360, hsl.s, hsl.l), container));
    }

    function generateShades(hex) {
        const container = document.getElementById('shades');
        container.innerHTML = '';
        for(let i = 2; i >= -3; i--) createNode(lightenDarkenColor(hex, i * 15), container);
    }

    function createNode(color, container) {
        const div = document.createElement('div');
        div.className = 'color-item';
        div.onclick = () => copyText(color);
        div.innerHTML = `
            <div class="swatch" style="background:${color}"></div>
            <div class="swatch-info">
                <span style="color:var(--text-label)">HEX</span>
                <span>${color}</span>
            </div>
        `;
        container.appendChild(div);
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function lightenDarkenColor(col, amt) {
        let usePound = true;
        if (col[0] == "#") { col = col.slice(1); usePound = true; }
        let num = parseInt(col, 16);
        let r = (num >> 16) + amt;
        if (r > 255) r = 255; else if (r < 0) r = 0;
        let b = ((num >> 8) & 0x00FF) + amt;
        if (b > 255) b = 255; else if (b < 0) b = 0;
        let g = (num & 0x0000FF) + amt;
        if (g > 255) g = 255; else if (g < 0) g = 0;
        return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0').toUpperCase();
    }

    function checkContrast(hex) {
        const box = document.getElementById('contrastCard');
        box.style.backgroundColor = hex;
        const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        box.style.color = brightness > 125 ? '#000' : '#fff';
        document.getElementById('contrastRatio').innerText = brightness > 125 ? 'LIGHT UI OK' : 'DARK UI OK';
    }

    updateAll(picker.value.toUpperCase());
</script>
</body>
</html>
