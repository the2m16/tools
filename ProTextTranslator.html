<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/web/images/favicon.png">
  <title>MLText Translator Pro v3.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/evidenceprime/html-docx-js@master/dist/html-docx.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg:      #0f172a;
      --panel:   #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --accent:  #3b82f6;
      --success: #42A785;
      --danger:  #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden;
    }

    .app { display: flex; height: 100vh; padding: 15px; gap: 15px; }

    .pane {
      flex: 1 1 50%; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; position: relative; min-width: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pane.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }

    .drag-overlay {
      display: none; position: absolute; inset: 0; z-index: 200;
      border-radius: 12px; background: rgba(59,130,246,0.10);
      border: 2px dashed var(--accent);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; pointer-events: none;
    }

    .pane.drag-over .drag-overlay { display: flex; }

    .drag-overlay-icon { font-size: 36px; opacity: 0.8; }
    .drag-overlay-text { font-size: 14px; font-weight: 600; color: var(--accent); }

    .header {
      padding: 10px 15px; background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 12px 12px 0 0; flex-shrink: 0;
    }

    .title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      color: #94a3b8; letter-spacing: 0.5px;
    }

    .header-controls { display: flex; gap: 10px; align-items: center; }

    .lang-select {
      background: #334155; color: white; border: 1px solid var(--border);
      padding: 4px 8px; border-radius: 6px; font-size: 12px;
      outline: none; cursor: pointer;
    }
    .lang-select:hover { border-color: var(--accent); }

    .content-area {
      flex: 1; padding: 20px; border: none; outline: none;
      background: transparent; color: #cbd5e1;
      font-size: 14px; line-height: 1.6; overflow-y: auto;
    }

    .content-area p { margin: 0 0 10px 0; }

    .content-area:empty::before {
      content: attr(placeholder); color: #64748b;
      font-size: 14px; pointer-events: none;
    }

    .content-area, .content-area * {
      background: transparent !important;
      background-color: transparent !important;
      color: #cbd5e1 !important;
    }

    .content-area ul, .content-area ol { padding-left: 20px; margin: 10px 0; }
    .content-area li { display: list-item; list-style-type: disc; }

    .btn {
      border: none; padding: 6px 12px; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: background 0.2s;
    }

    .btn-clear { background: #334155; color: white; }
    .btn-clear:hover { background: var(--danger); }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn:disabled { background: #475569 !important; cursor: not-allowed; }

    .translate-btn {
      position: absolute; bottom: 25px; right: 25px;
      padding: 12px 24px; background: var(--success); color: white;
      border: none; border-radius: 50px; font-weight: 600;
      cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      z-index: 100; display: flex; align-items: center; gap: 8px;
      transition: background 0.2s, opacity 0.2s;
    }
    .translate-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.8; }

    #progress {
      position: absolute; top: 0; left: 0; height: 3px;
      background: var(--success); width: 0%; transition: width 0.3s;
      border-radius: 12px 0 0 0; z-index: 10;
    }

    .label-small { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="app">

  <!-- LEFT PANE: Source -->
  <div class="pane" id="left-pane">

    <div class="drag-overlay">
      <div class="drag-overlay-icon">📄</div>
      <div class="drag-overlay-text">Файлаа энд тавина уу (.doc / .docx / .pdf)</div>
    </div>

    <div class="header">
      <span class="title" id="file-status">Source</span>
      <div class="header-controls">
        <span class="label-small">TARGET LANGUAGE:</span>
        <select id="targetLang" class="lang-select">
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="it">Italian</option>
          <option value="uk">Ukrainian</option>
          <option value="he">Hebrew</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="mn">Mongolian</option>
          <option value="ru">Russian</option>
        </select>
        <button class="btn btn-clear" onclick="clearFields()">Clear</button>
      </div>
    </div>

    <div
      id="in"
      class="content-area"
      contenteditable="true"
      spellcheck="false"
      placeholder="Энэ талбарт орчуулах эх текстээ (дурын хэлээр) хуулж тавих (CTRL+V), .doc .docx .pdf файлаар нь Drug&Drop хийж оруулах, эсвэл гараар бичих..."
    ></div>

    <button class="translate-btn" id="btn" onclick="startTranslation()">
      <span id="btn-txt">TRANSLATE NOW</span>
    </button>
  </div>

  <!-- RIGHT PANE: Output -->
  <div class="pane">
    <div id="progress"></div>

    <div class="header">
      <span class="title">Translated Result</span>
      <div class="header-controls">
        <button class="btn btn-primary" id="copy-btn" onclick="copyResult(this)" disabled>Copy text</button>
        <button class="btn btn-primary" id="download-btn" onclick="downloadWordResult()" disabled>Download .docx</button>
      </div>
    </div>

    <div
      id="out"
      class="content-area"
      spellcheck="false"
      placeholder="Энэ талбарт орчуулгын үр дүн гарна..."
    ></div>
  </div>

</div>

<script>
  // ── PDF.js worker ────────────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── Drag & Drop ──────────────────────────────────────────────────────────────
  const leftPane = document.getElementById('left-pane');

  leftPane.addEventListener('dragenter', (e) => {
    e.preventDefault();
    leftPane.classList.add('drag-over');
  });

  leftPane.addEventListener('dragover', (e) => {
    e.preventDefault();
  });

  leftPane.addEventListener('dragleave', (e) => {
    if (!leftPane.contains(e.relatedTarget)) {
      leftPane.classList.remove('drag-over');
    }
  });

  leftPane.addEventListener('drop', (e) => {
    e.preventDefault();
    leftPane.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  // ── File loading ─────────────────────────────────────────────────────────────
  function loadFile(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.docx') || name.endsWith('.doc')) {
      loadDocx(file);
    } else if (name.endsWith('.pdf')) {
      loadPdf(file);
    } else {
      alert('Зөвхөн .doc, .docx, .pdf файл дэмжигдэнэ.');
    }
  }

  function loadDocx(file) {
    document.getElementById('file-status').innerText = 'Loaded: ' + file.name;
    const reader = new FileReader();
    reader.onload = function (e) {
      mammoth.convertToHtml({ arrayBuffer: e.target.result })
        .then((result) => {
          document.getElementById('in').innerHTML = result.value;
        })
        .catch((err) => {
          alert('Word файл уншихад алдаа гарлаа: ' + err);
        });
    };
    reader.readAsArrayBuffer(file);
  }

  async function loadPdf(file) {
    document.getElementById('file-status').innerText = 'Loaded: ' + file.name;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let html = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageText = content.items.map((item) => item.str).join(' ');
        html += '<p>' + pageText + '</p>';
      }
      document.getElementById('in').innerHTML = html || '<p>PDF-ээс текст олдсонгүй.</p>';
    } catch (err) {
      alert('PDF уншихад алдаа гарлаа: ' + err);
    }
  }

  // ── Translation ───────────────────────────────────────────────────────────────
  async function startTranslation() {
    const sourceHTML = document.getElementById('in').innerHTML.trim();
    const targetLang = document.getElementById('targetLang').value;
    if (!sourceHTML) return;

    const translateBtn = document.getElementById('btn');
    const btnLabel     = document.getElementById('btn-txt');
    const progressBar  = document.getElementById('progress');

    translateBtn.disabled = true;
    btnLabel.innerText = 'Processing...';

    const parser = new DOMParser();
    const doc = parser.parseFromString(sourceHTML, 'text/html');

    const textNodes = [];
    const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null);
    let node;
    while ((node = walker.nextNode())) {
      if (
        node.textContent.trim().length > 0 &&
        !node.parentElement.closest('script, style')
      ) {
        textNodes.push(node);
      }
    }

    for (let i = 0; i < textNodes.length; i++) {
      const pct = Math.round((i + 1) / textNodes.length * 100);
      progressBar.style.width = pct + '%';
      btnLabel.innerText = 'Translating ' + pct + '%...';

      try {
        const text = textNodes[i].textContent.trim();
        const url =
          'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
          targetLang + '&dt=t&q=' + encodeURIComponent(text);

        const response = await fetch(url);
        const data = await response.json();

        if (data && data[0]) {
          textNodes[i].textContent = data[0].map((chunk) => chunk[0]).join('');
        }
      } catch (err) {
        console.error('Translation error at node ' + i + ':', err);
      }
    }

    document.getElementById('out').innerHTML = doc.body.innerHTML;

    document.getElementById('copy-btn').disabled     = false;
    document.getElementById('download-btn').disabled = false;

    translateBtn.disabled  = false;
    btnLabel.innerText     = 'TRANSLATE NOW';
    progressBar.style.width = '0%';
  }

  // ── Copy result ───────────────────────────────────────────────────────────────
  function copyResult(btn) {
    const outEl = document.getElementById('out');
    const text = outEl.innerText || outEl.textContent || '';
    if (!text.trim()) return;

    const original = btn.innerText;
    const finish = () => {
      btn.innerText = 'Copied!';
      btn.style.background = 'var(--success)';
      setTimeout(() => {
        btn.innerText = original;
        btn.style.background = '';
      }, 1800);
    };

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(outEl, finish));
    } else {
      fallbackCopy(outEl, finish);
    }
  }

  function fallbackCopy(el, callback) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    callback();
  }

  // ── Download .docx ────────────────────────────────────────────────────────────
  function downloadWordResult() {
    const html = document.getElementById('out').innerHTML;
    if (!html) return;
    const blob = htmlDocx.asBlob(html);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'translated_document.docx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // ── Clear ─────────────────────────────────────────────────────────────────────
  function clearFields() {
    document.getElementById('in').innerHTML  = '';
    document.getElementById('out').innerHTML = '';
    document.getElementById('file-status').innerText = 'Source';
    document.getElementById('copy-btn').disabled     = true;
    document.getElementById('download-btn').disabled = true;
  }

  // ── Paste: strip inline styles ────────────────────────────────────────────────
  document.getElementById('in').addEventListener('paste', function (e) {
    e.preventDefault();
    let html = (e.clipboardData || e.originalEvent.clipboardData).getData('text/html');

    if (!html) {
      const plain = (e.clipboardData || e.originalEvent.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, plain);
      return;
    }

    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('*').forEach((el) => {
      el.removeAttribute('style');
      el.removeAttribute('class');
      el.removeAttribute('bgcolor');
    });
    document.execCommand('insertHTML', false, tmp.innerHTML);
  });
</script>

</body>
</html>
